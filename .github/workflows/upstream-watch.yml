# Notice when upstream has moved, and say so in an issue.
#
# Runs the check CLAUDE.md prescribes ("Checking whether upstream has anything
# new") against freshly fetched refs, so it never compares against a stale
# clone. Nothing is retargeted automatically: a version bump goes through
# bump.sh, whose RE-ANCHOR cases must be confirmed by hand.
#
# Decision rule: upstream/main is an ancestor of main AND the anchor target,
# the latest upstream tag and the latest npm release all agree => nothing to do.
# Anything else opens one issue per distinct state (deduplicated by title).
name: upstream-watch

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare against upstream
        id: cmp
        run: |
          git remote add upstream https://github.com/openduo/duoduo.git
          git fetch upstream --prune --tags --force

          target=$(cat docs/.pretty-anchor-target)
          tag=$(git describe --tags --abbrev=0 upstream/main)
          npm_version="v$(npm view @openduo/duoduo version)"
          upstream_head=$(git rev-parse --short upstream/main)

          if git merge-base --is-ancestor upstream/main HEAD; then landed=yes; else landed=no; fi
          echo "anchor target: $target | upstream tag: $tag | npm: $npm_version | upstream/main $upstream_head landed in main: $landed"

          if [ "$landed" = yes ] && [ "$target" = "$tag" ] && [ "$target" = "$npm_version" ]; then
            echo "up to date"
            echo "moved=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "The daily upstream check found this repo behind upstream."
            echo
            echo "| signal | value |"
            echo "|---|---|"
            echo "| \`docs/.pretty-anchor-target\` (last reconstructed to) | \`$target\` |"
            echo "| latest upstream tag | \`$tag\` |"
            echo "| latest npm release of \`@openduo/duoduo\` | \`$npm_version\` |"
            echo "| \`upstream/main\` ($upstream_head) is an ancestor of \`main\` | $landed |"
            if [ "$landed" = no ]; then
              echo
              echo "Upstream commits not yet in \`main\`:"
              echo
              echo '```'
              git log --oneline HEAD..upstream/main | head -50
              echo '```'
            fi
            echo
            echo "Next steps are in CLAUDE.md: merge upstream, then for a new release run \`bump.sh\` before \`rebuild.sh\`, and retarget the docs in the order given there."
          } > "$RUNNER_TEMP/body.md"

          echo "moved=yes" >> "$GITHUB_OUTPUT"
          echo "title=Upstream moved: npm $npm_version, tag $tag, upstream/main $upstream_head" >> "$GITHUB_OUTPUT"

      - name: Open an issue (once per state)
        if: steps.cmp.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.cmp.outputs.title }}
        run: |
          gh label create upstream-sync --color 0e8a16 --description "Upstream moved; reconstruction and docs need retargeting" --force
          if gh issue list --label upstream-sync --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "already reported: $TITLE"
          else
            gh issue create --title "$TITLE" --label upstream-sync --body-file "$RUNNER_TEMP/body.md"
          fi
